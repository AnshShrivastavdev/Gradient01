services:
  # 1. FastAPI Real-Time Telemetry & ML Inference Backend
  - type: web
    name: mine-subsidence-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: HOST
        value: 0.0.0.0
      - key: SIMULATION_MODE
        value: "false"

  # 2. 3D React Interactive Landing Page & Geotechnical Dashboard Frontend
  - type: web
    name: mine-subsidence-frontend
    runtime: static
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
