
; ================================================================
; SIH 2026 - Underground Coal Mine Monitoring
; GATEWAY NODE 3 - WiFi-Enabled LoRa Receiver
; Team Gradient
;
; ESP32 DevKit V1 + SX1278 LoRa + WiFi HTTP
; ================================================================

[env:esp32gateway]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5

; Upload speed (increase for faster flashing)
upload_speed = 921600

lib_deps = 
    sandeepmistry/LoRa @ ^0.8.0
    bblanchon/ArduinoJson @ ^7.0.4

; Build flags for WiFi + HTTP (built into ESP32 Arduino core)
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_RUNNING_CORE=1

; Monitor filters for clean serial output
monitor_filters = 
    esp32_exception_decoder
    default
