; ================================================================
; SIH 2026 - Underground Coal Mine Monitoring System
; SENSOR NODE PLATFORMIO CONFIGURATION
; Team Gradient
;
; How to upload:
;   - Upload Node 1 (Reference)  : pio run -e node1_reference -t upload
;   - Upload Node 2 (Monitoring) : pio run -e node2_monitoring -t upload
; ================================================================

[platformio]
default_envs = node2_monitoring

; ----------------------------------------------------------------
; NODE 1: REFERENCE DATUM NODE
; Hardware: ESP32 + MPU6500 (ONLY) + LoRa SX1278 (433 MHz)
; Purpose : Reference baseline orientation for false-alarm rejection
; ----------------------------------------------------------------
[env:node1_reference]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<node1_reference.cpp>
lib_deps = 
    sandeepmistry/LoRa @ ^0.8.0
    bblanchon/ArduinoJson @ ^7.0.4

; ----------------------------------------------------------------
; NODE 2: MAIN STRATA SUBSIDENCE MONITORING NODE
; Hardware: ESP32 + MPU6500 + VL53L4CD + HX711 + Piezo LM358 + LoRa
; Purpose : Full real-time underground roof sag & strain monitoring
; ----------------------------------------------------------------
[env:node2_monitoring]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<node2_monitoring.cpp> +<mpu6500_handler.cpp> +<vl53l4cd_handler.cpp> +<strain_hx711_handler.cpp> +<piezo_handler.cpp>
lib_deps = 
    sandeepmistry/LoRa @ ^0.8.0
    stm32duino/STM32duino VL53L4CD @ ^1.0.3
    bogde/HX711 @ ^0.7.5
    bblanchon/ArduinoJson @ ^7.0.4
